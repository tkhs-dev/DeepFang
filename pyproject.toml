[project]
name = "DeepFang"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "tkhs", email = "tokuhausu@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.3.2",
    "onnx>=1.18.0",
    "torch>=2.8.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.workspace]
members = [
 "runner",
 "trainer",
 "lib/model",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["runner"]
