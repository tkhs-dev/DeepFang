syntax = "proto3";
package env;

option go_package = "server/grpc";

service EnvService {
  rpc CollectExperience(CollectExperienceRequest) returns (stream CollectExperienceResponse);
}

message CollectExperienceRequest {
  EnvArgs args = 1;
  int32 worker_num = 2;
  repeated bytes models = 3; // Model data in bytes
  int32 step_num = 4; // Number of steps to collect
  int32 chunk_size = 5; // Size of each chunk of experience
}

message CollectExperienceResponse {
  repeated Experience experiences = 1;
}

message EnvArgs {
  int32 board_width = 1; // Width of the game board
  int32 board_height = 2; // Height of the game board
  int32 food_spawn_chance = 3; // Chance of food spawning
  int32 minimum_food = 4; // Minimum number of food items
  repeated string snakes = 5;
}

message Experience {
  BoardState board_state = 1;
  repeated float actor = 2; // Actor's score
  float critic = 3; // Critic's score
  int32 action = 4; // Action taken by the agent
  float reward = 5; // Reward for the step
  bool done = 6; // Whether the episode is done
}

message BoardState {
  repeated Snake snakes = 1; // List of snakes
  repeated Point food = 2; // List of food points
}

message Snake {
  repeated Point body = 1;

}

message Point {
  int32 x = 1; // X coordinate
  int32 y = 2; // Y coordinate
}